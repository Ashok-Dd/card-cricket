# Flutter's default -Xmx8G assumes far more RAM than this machine has
# (~7.8GB total, often <500MB free) — that caused the Gradle daemon to crash
# with a native OOM. 1.5G fits comfortably; raise it only if this machine
# gets more RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
org.gradle.daemon=true
android.useAndroidX=true
