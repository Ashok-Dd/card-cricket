# Pings the deployed backend every 10 minutes so Render's free tier never
# sees 15 minutes of total inactivity and spins the service down — see
# [[real-cricket-data-pipeline]] project memory for why: Render's own docs
# confirm WebSocket messages from an existing connection count as activity
# too, so an active match never risks this; this specifically covers gaps
# where nobody's connected at all (e.g. overnight), so the NEXT person to
# open the app doesn't eat a ~1-minute cold start.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 30 https://card-cricket-backend.onrender.com/ \
            && echo "Backend responded OK" \
            || echo "Ping failed (backend may be mid cold-start or briefly down) — not treated as a workflow failure"
